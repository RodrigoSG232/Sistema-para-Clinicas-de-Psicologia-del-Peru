version: "3.9"

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinica_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Admin123!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost", "-U", "sa", "-P", "Admin123!",
             "-No", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - clinica_net

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinica_db_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Admin123!"
    volumes:
      - ./database/init.sql:/init.sql
    entrypoint: /bin/bash
    command: >
      -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Admin123!' -No -i /init.sql -e && echo 'Base de datos inicializada.'"
    networks:
      - clinica_net
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinica_backend
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: ClinicaPsicologia
      DB_USER: sa
      DB_PASSWORD: "Admin123!"
      APP_JWT_SECRET: "cLinIcApsIcOlOgIaPerU2025SecretKeyLong256BitsXXXXX"
      APP_JWT_EXPIRATION_MS: 86400000
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - clinica_net
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinica_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - clinica_net
    restart: on-failure

volumes:
  sqlserver_data:
    name: clinica_sqlserver_data

networks:
  clinica_net:
    name: clinica_network
    driver: bridge
