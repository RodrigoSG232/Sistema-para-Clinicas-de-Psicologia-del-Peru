spring.application.name=clinica-psicologia-backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ── Base de datos PostgreSQL (Neon) ───────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ── Server ────────────────────────────────────────────────────
server.port=8080
server.error.include-message=always

# ── JWT ───────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:cLinIcApsIcOlOgIaPerU2025SecretKeyLong256BitsXXXXX}
app.jwt.expiration-ms=86400000

# ── CORS (permite el frontend Angular en dev) ─────────────────
app.cors.allowed-origins=http://localhost:4200,http://frontend:4200
    
# Configuración para envío de correos electrónicos (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
