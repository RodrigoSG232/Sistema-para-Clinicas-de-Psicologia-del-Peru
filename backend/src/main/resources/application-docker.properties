# ── Perfil Docker: sobreescribe valores para contenedor ───────
legacy.business-api.enabled=false

# Base de datos (usa variables de entorno del docker-compose)
spring.datasource.url=jdbc:sqlserver://${DB_HOST:sqlserver}:${DB_PORT:1433};databaseName=${DB_NAME:ClinicaPsicologia};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:Admin123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT
app.jwt.secret=${JWT_SECRET:cLinIcApsIcOlOgIaPerU2025SecretKeyLong256BitsXXXXX}
app.jwt.expiration-ms=86400000

# CORS: acepta peticiones del frontend en Docker y del host
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://frontend,http://localhost}

# El backend actúa como entrada autenticada para el frontend.
services.clinical.base-url=${CLINICAL_SERVICE_URL:http://clinical-service:8084}
services.queue.base-url=${QUEUE_SERVICE_URL:http://queue-service:8085}
services.patient.base-url=${PATIENT_SERVICE_URL:http://patient-service:8081}
services.scheduling.base-url=${SCHEDULING_SERVICE_URL:http://scheduling-service:8082}
services.billing.base-url=${BILLING_SERVICE_URL:http://billing-service:8083}
services.internal-api-key=${INTERNAL_API_KEY:cpp-internal-dev-key}
