apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: patient-db-data
  namespace: cpp
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-db
  namespace: cpp
  labels: { app: patient-db, tier: database }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: patient-db }
  template:
    metadata:
      labels: { app: patient-db, tier: database }
    spec:
      containers:
        - name: mysql
          image: cpp/mysql-kind:8.4
          imagePullPolicy: Never
          ports: [{ name: mysql, containerPort: 3306 }]
          env:
            - { name: MYSQL_DATABASE, value: cpp_patients }
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: PATIENT_DB_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: PATIENT_DB_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: PATIENT_DB_ROOT_PASSWORD } }
            - { name: TZ, value: America/Lima }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
          startupProbe:
            exec: { command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'] }
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            exec: { command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'] }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: patient-db-data }
---
apiVersion: v1
kind: Service
metadata: { name: patient-db, namespace: cpp }
spec:
  selector: { app: patient-db }
  ports: [{ name: mysql, port: 3306, targetPort: mysql }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: scheduling-db-data, namespace: cpp }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling-db
  namespace: cpp
  labels: { app: scheduling-db, tier: database }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: scheduling-db }
  template:
    metadata:
      labels: { app: scheduling-db, tier: database }
    spec:
      containers:
        - name: postgres
          image: cpp/postgres-kind:17
          imagePullPolicy: Never
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: cpp_scheduling }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: SCHEDULING_DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: SCHEDULING_DB_PASSWORD } }
            - { name: TZ, value: America/Lima }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          startupProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 10
          resources:
            requests: { cpu: 75m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: scheduling-db-data }
---
apiVersion: v1
kind: Service
metadata: { name: scheduling-db, namespace: cpp }
spec:
  selector: { app: scheduling-db }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: billing-db-data, namespace: cpp }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-db
  namespace: cpp
  labels: { app: billing-db, tier: database }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: billing-db }
  template:
    metadata:
      labels: { app: billing-db, tier: database }
    spec:
      securityContext: { fsGroup: 10001 }
      containers:
        - name: sqlserver
          image: cpp/sqlserver-kind:2022
          imagePullPolicy: Never
          ports: [{ name: sqlserver, containerPort: 1433 }]
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_PID, value: Developer }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: BILLING_DB_PASSWORD } }
            - { name: TZ, value: America/Lima }
          volumeMounts: [{ name: data, mountPath: /var/opt/mssql }]
          startupProbe:
            tcpSocket: { port: sqlserver }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: sqlserver }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: billing-db-data }
---
apiVersion: v1
kind: Service
metadata: { name: billing-db, namespace: cpp }
spec:
  selector: { app: billing-db }
  ports: [{ name: sqlserver, port: 1433, targetPort: sqlserver }]
---
