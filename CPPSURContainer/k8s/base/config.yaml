apiVersion: v1
kind: ConfigMap
metadata:
  name: cpp-runtime-config
  namespace: cpp
data:
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
  TZ: America/Lima
---
# Valores exclusivos para desarrollo local con Kind. En nube deben sustituirse
# por un gestor de secretos y no deben reutilizarse estas contraseñas.
apiVersion: v1
kind: Secret
metadata:
  name: cpp-local-secrets
  namespace: cpp
type: Opaque
stringData:
  INTERNAL_API_KEY: cpp-internal-dev-key
  PATIENT_DB_USER: cpp_patient
  PATIENT_DB_PASSWORD: cpp_patient_dev
  PATIENT_DB_ROOT_PASSWORD: cpp_root_dev
  SCHEDULING_DB_USER: cpp_scheduling
  SCHEDULING_DB_PASSWORD: cpp_scheduling_dev
  BILLING_DB_USER: sa
  BILLING_DB_PASSWORD: CppBilling!2026Dev
  CLINICAL_DB_USER: cpp_clinical
  CLINICAL_DB_PASSWORD: cpp_clinical_dev
  QUEUE_DB_USER: cpp_queue
  QUEUE_DB_PASSWORD: cpp_queue_dev
  QUEUE_DB_ROOT_PASSWORD: root_queue_dev

