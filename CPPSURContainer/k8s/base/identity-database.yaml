apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-db-data
  namespace: cpp
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-db
  namespace: cpp
  labels: { app: identity-db, tier: database }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: identity-db }
  template:
    metadata:
      labels: { app: identity-db, tier: database }
    spec:
      enableServiceLinks: false
      securityContext: { fsGroup: 10001 }
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: Never
          ports: [{ name: sqlserver, containerPort: 1433 }]
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_PID, value: Express }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: IDENTITY_DB_PASSWORD } }
            - { name: TZ, value: America/Lima }
          volumeMounts: [{ name: data, mountPath: /var/opt/mssql }]
          startupProbe:
            tcpSocket: { port: sqlserver }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: sqlserver }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: identity-db-data }
---
apiVersion: v1
kind: Service
metadata:
  name: identity-db
  namespace: cpp
  labels: { app: identity-db }
spec:
  selector: { app: identity-db }
  ports: [{ name: sqlserver, port: 1433, targetPort: sqlserver }]

