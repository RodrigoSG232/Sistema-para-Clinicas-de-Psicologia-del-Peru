apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: cpp
  labels: { app: config-server, tier: infrastructure }
spec:
  replicas: 1
  selector:
    matchLabels: { app: config-server }
  template:
    metadata:
      labels: { app: config-server, tier: infrastructure }
    spec:
      enableServiceLinks: false
      containers:
        - name: config-server
          image: cpp/config-server:0.1.0
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8888 }]
          env:
            - { name: CONFIG_SERVER_PORT, value: "8888" }
            - { name: JAVA_TOOL_OPTIONS, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: JAVA_TOOL_OPTIONS } } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: INTERNAL_API_KEY } }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 75m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: cpp
  labels: { app: config-server }
spec:
  selector: { app: config-server }
  ports: [{ name: http, port: 8888, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: cpp
  labels: { app: eureka-server, tier: infrastructure }
spec:
  replicas: 1
  selector:
    matchLabels: { app: eureka-server }
  template:
    metadata:
      labels: { app: eureka-server, tier: infrastructure }
    spec:
      enableServiceLinks: false
      containers:
        - name: eureka-server
          image: cpp/eureka-server:0.1.0
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8761 }]
          env:
            - { name: CONFIG_SERVER_URL, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: CONFIG_SERVER_URL } } }
            - { name: EUREKA_DEFAULT_ZONE, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: EUREKA_DEFAULT_ZONE } } }
            - { name: EUREKA_HOSTNAME, value: eureka-server }
            - { name: JAVA_TOOL_OPTIONS, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: JAVA_TOOL_OPTIONS } } }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: cpp
  labels: { app: eureka-server }
spec:
  selector: { app: eureka-server }
  ports: [{ name: http, port: 8761, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cpp
  labels: { app: api-gateway, tier: infrastructure }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway, tier: infrastructure }
    spec:
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: cpp/api-gateway:0.1.0
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: CONFIG_SERVER_URL, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: CONFIG_SERVER_URL } } }
            - { name: EUREKA_DEFAULT_ZONE, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: EUREKA_DEFAULT_ZONE } } }
            - { name: JAVA_TOOL_OPTIONS, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: JAVA_TOOL_OPTIONS } } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: INTERNAL_API_KEY } }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cpp
  labels: { app: api-gateway }
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
