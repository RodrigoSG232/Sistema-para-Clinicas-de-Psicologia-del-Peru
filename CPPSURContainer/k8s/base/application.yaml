apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cpp
  labels: { app: backend, tier: facade }
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend, tier: facade }
    spec:
      enableServiceLinks: false
      containers:
        - name: backend
          image: cpp/identity-facade:0.1.0
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: docker }
            - { name: DB_HOST, value: identity-db }
            - { name: DB_PORT, value: "1433" }
            - { name: DB_NAME, value: ClinicaPsicologia }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: IDENTITY_DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: IDENTITY_DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: JWT_SECRET } }
            - name: MAIL_USERNAME
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: MAIL_USERNAME } }
            - name: MAIL_PASSWORD
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: MAIL_PASSWORD } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: INTERNAL_API_KEY } }
            - { name: PATIENT_SERVICE_URL, value: http://patient-service:8081 }
            - { name: SCHEDULING_SERVICE_URL, value: http://scheduling-service:8082 }
            - { name: BILLING_SERVICE_URL, value: http://billing-service:8083 }
            - { name: CLINICAL_SERVICE_URL, value: http://clinical-service:8084 }
            - { name: QUEUE_SERVICE_URL, value: http://queue-service:8085 }
            - { name: JAVA_TOOL_OPTIONS, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: JAVA_TOOL_OPTIONS } } }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cpp
  labels: { app: backend }
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cpp
  labels: { app: frontend, tier: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, tier: web }
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: cpp/frontend:0.1.0
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 80 }]
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cpp
  labels: { app: frontend }
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30420

