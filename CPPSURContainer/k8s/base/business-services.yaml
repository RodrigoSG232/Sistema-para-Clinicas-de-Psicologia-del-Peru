apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: cpp
  labels: { app: patient-service, tier: business }
spec:
  replicas: 1
  selector:
    matchLabels: { app: patient-service }
  template:
    metadata:
      labels: { app: patient-service, tier: business }
    spec:
      enableServiceLinks: false
      containers:
        - name: patient-service
          image: cpp/patient-service:0.1.0
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8081 }]
          env:
            - { name: CONFIG_SERVER_URL, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: CONFIG_SERVER_URL } } }
            - { name: EUREKA_DEFAULT_ZONE, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: EUREKA_DEFAULT_ZONE } } }
            - { name: JAVA_TOOL_OPTIONS, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: JAVA_TOOL_OPTIONS } } }
            - { name: PATIENT_DB_URL, value: 'jdbc:mysql://patient-db:3306/cpp_patients?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima' }
            - name: PATIENT_DB_USER
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: PATIENT_DB_USER } }
            - name: PATIENT_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: PATIENT_DB_PASSWORD } }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: patient-service, namespace: cpp, labels: { app: patient-service } }
spec:
  selector: { app: patient-service }
  ports: [{ name: http, port: 8081, targetPort: http }]
---
