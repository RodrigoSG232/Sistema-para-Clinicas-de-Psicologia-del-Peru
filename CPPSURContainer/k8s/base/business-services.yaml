metadata:
  name: billing-service
  namespace: cpp
  labels: { app: billing-service, tier: business }
spec:
  replicas: 1
  selector:
    matchLabels: { app: billing-service }
  template:
    metadata:
      labels: { app: billing-service, tier: business }
    spec:
      enableServiceLinks: false
      containers:
        - name: billing-service
          image: cpp/billing-service:0.1.0
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8083 }]
          env:
            - { name: CONFIG_SERVER_URL, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: CONFIG_SERVER_URL } } }
            - { name: EUREKA_DEFAULT_ZONE, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: EUREKA_DEFAULT_ZONE } } }
            - { name: JAVA_TOOL_OPTIONS, valueFrom: { configMapKeyRef: { name: cpp-runtime-config, key: JAVA_TOOL_OPTIONS } } }
            - { name: BILLING_DB_URL, value: 'jdbc:sqlserver://billing-db:1433;databaseName=cpp_billing;encrypt=true;trustServerCertificate=true' }
            - name: BILLING_DB_USER
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: BILLING_DB_USER } }
            - name: BILLING_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: cpp-local-secrets, key: BILLING_DB_PASSWORD } }
            - { name: BILLING_DB_NAME, value: cpp_billing }
            - { name: BILLING_DB_AUTO_CREATE, value: "true" }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
