services:
  clinical-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cpp_clinical
      POSTGRES_USER: cpp_clinical
      POSTGRES_PASSWORD: cpp_clinical_dev
      TZ: America/Lima
    ports: ["5434:5432"]
    volumes: [clinical-db-data:/var/lib/postgresql/data]
    networks: [cpp-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    mem_limit: 384m
    restart: unless-stopped
  clinical-service:
    image: cpp/clinical-service:0.1.0
    build:
      context: .
      dockerfile: CPPMSClinical/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      CLINICAL_DB_URL: jdbc:postgresql://clinical-db:5432/cpp_clinical
      CLINICAL_DB_USER: cpp_clinical
      CLINICAL_DB_PASSWORD: cpp_clinical_dev
      INTERNAL_API_KEY: cpp-internal-dev-key
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports: ["8084:8084"]
    networks: [cpp-network]
    depends_on:
      config-server: {condition: service_healthy}
      eureka-server: {condition: service_healthy}
      patient-service: {condition: service_healthy}
      scheduling-service: {condition: service_healthy}
      clinical-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 25s
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
volumes:
  clinical-db-data:
