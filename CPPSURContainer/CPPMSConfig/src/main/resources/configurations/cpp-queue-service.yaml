server:
  port: ${QUEUE_SERVICE_PORT:8085}
spring:
  datasource:
    url: ${QUEUE_DB_URL:jdbc:mysql://localhost:3308/cpp_queue?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${QUEUE_DB_USER:cpp_queue}
    password: ${QUEUE_DB_PASSWORD:cpp_queue_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

internal:
  api:
    key: ${INTERNAL_API_KEY:cpp-internal-dev-key}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
