server:
  port: ${SCHEDULING_SERVICE_PORT:8082}

spring:
  datasource:
    url: ${SCHEDULING_DB_URL:jdbc:postgresql://localhost:5433/cpp_scheduling}
    username: ${SCHEDULING_DB_USER:cpp_scheduling}
    password: ${SCHEDULING_DB_PASSWORD:cpp_scheduling_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
