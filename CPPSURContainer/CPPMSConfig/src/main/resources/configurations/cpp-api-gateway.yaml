server:
  port: ${GATEWAY_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          default-filters:
            - AddRequestHeader=X-Gateway-Request, true
            - AddRequestHeader=X-Internal-Api-Key, ${INTERNAL_API_KEY:cpp-internal-dev-key}
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:4200
                  - http://localhost
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                maxAge: 3600
          routes:
            - id: identity-service
              uri: lb://cpp-identity-service
              predicates:
                - Path=/api/identity/**
            - id: patient-service
              uri: lb://cpp-patient-service
              predicates:
                - Path=/api/patients/**
            - id: scheduling-service
              uri: lb://cpp-scheduling-service
              predicates:
                - Path=/api/scheduling/**
            - id: billing-service
              uri: lb://cpp-billing-service
              predicates:
                - Path=/api/billing/**
            - id: clinical-service
              uri: lb://cpp-clinical-service
              predicates:
                - Path=/api/clinical/**
            - id: queue-service
              uri: lb://cpp-queue-service
              predicates:
                - Path=/api/queue/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only
