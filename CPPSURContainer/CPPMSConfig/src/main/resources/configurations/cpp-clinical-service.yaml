server:
  port: ${CLINICAL_SERVICE_PORT:8084}
spring:
  datasource:
    url: ${CLINICAL_DB_URL:jdbc:postgresql://localhost:5434/cpp_clinical}
    username: ${CLINICAL_DB_USER:cpp_clinical}
    password: ${CLINICAL_DB_PASSWORD:cpp_clinical_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

internal:
  api:
    key: ${INTERNAL_API_KEY:cpp-internal-dev-key}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
