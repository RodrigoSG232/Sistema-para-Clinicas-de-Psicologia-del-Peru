server:
  port: ${PATIENT_SERVICE_PORT:8081}

spring:
  datasource:
    url: ${PATIENT_DB_URL:jdbc:mysql://localhost:3307/cpp_patients?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${PATIENT_DB_USER:cpp_patient}
    password: ${PATIENT_DB_PASSWORD:cpp_patient_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
