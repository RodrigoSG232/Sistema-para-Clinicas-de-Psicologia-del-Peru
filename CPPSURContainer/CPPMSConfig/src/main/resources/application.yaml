server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: cpp-config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configurations

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

info:
  app:
    name: CPP Config Server
    description: Configuracion centralizada de la plataforma CPP
