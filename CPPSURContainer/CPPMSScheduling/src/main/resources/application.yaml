spring:
  application:
    name: cpp-scheduling-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

internal:
  api:
    key: ${INTERNAL_API_KEY:cpp-internal-dev-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: CPP Scheduling Service
    description: Gestion independiente de agenda, psicologos y citas
