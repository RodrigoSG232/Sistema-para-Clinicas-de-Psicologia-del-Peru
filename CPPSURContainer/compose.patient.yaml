services:
  patient-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cpp_patients
      MYSQL_USER: cpp_patient
      MYSQL_PASSWORD: cpp_patient_dev
      MYSQL_ROOT_PASSWORD: cpp_root_dev
      TZ: America/Lima
    ports:
      - "3307:3306"
    volumes:
      - patient-db-data:/var/lib/mysql
    networks:
      - cpp-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  patient-service:
    image: cpp/patient-service:0.1.0
    build:
      context: .
      dockerfile: CPPMSPatient/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      PATIENT_DB_URL: jdbc:mysql://patient-db:3306/cpp_patients?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
      PATIENT_DB_USER: cpp_patient
      PATIENT_DB_PASSWORD: cpp_patient_dev
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "8081:8081"
    networks:
      - cpp-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      patient-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 25s
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  patient-db-data:
