services:
  scheduling-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cpp_scheduling
      POSTGRES_USER: cpp_scheduling
      POSTGRES_PASSWORD: cpp_scheduling_dev
      TZ: America/Lima
    ports:
      - "5433:5432"
    volumes:
      - scheduling-db-data:/var/lib/postgresql/data
    networks:
      - cpp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    mem_limit: 384m
    restart: unless-stopped

  scheduling-service:
    image: cpp/scheduling-service:0.1.0
    build:
      context: .
      dockerfile: CPPMSScheduling/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      SCHEDULING_DB_URL: jdbc:postgresql://scheduling-db:5432/cpp_scheduling
      SCHEDULING_DB_USER: cpp_scheduling
      SCHEDULING_DB_PASSWORD: cpp_scheduling_dev
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "8082:8082"
    networks:
      - cpp-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      scheduling-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 25s
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  scheduling-db-data:
